server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker / Docker Compose uniquement : relais vers le conteneur "api".
    # Dans Kubernetes, c'est l'Ingress qui envoie /api directement à l'API.
    location /api {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}