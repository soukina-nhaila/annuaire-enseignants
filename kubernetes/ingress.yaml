apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: annuaire
  namespace: annuaire
spec:
  ingressClassName: nginx
  rules:
    - host: annuaire.local
      http:
        paths:
          # /api est conservé tel quel : l'API expose déjà /api/health, /api/enseignants...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80