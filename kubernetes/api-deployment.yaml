apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: annuaire
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: annuaire-api:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: ENSEIGNANTS_FILE
              value: /data/enseignants.json
          volumeMounts:
            - name: donnees
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: donnees
          configMap:
            name: enseignants-data